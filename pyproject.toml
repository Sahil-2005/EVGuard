[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evguard"
version = "1.0.0"
description = "Electric Vehicle Battery Health Analysis Using Big Data Techniques"
authors = [{ name = "EVGuard Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.1",
    "pyarrow==16.1.0",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "streamlit==1.38.0",
    "plotly==5.24.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["evguard"]
